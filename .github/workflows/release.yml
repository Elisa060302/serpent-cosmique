name: Publication

# Une version se publie en posant une étiquette vX.Y.Z sur la branche principale. Rien d'autre ne publie.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

# Les publications se suivent une à une, dans l'ordre d'arrivée, sans jamais en annuler une en cours.
concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  controle:
    name: Contrôle de l'étiquette
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: L'étiquette est sur la branche principale et porte la version du jeu
        run: |
          set -eu
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "L'étiquette $TAG ne pointe pas sur un commit de la branche principale." >&2
            exit 1
          }
          version=$(node --print "require('./package.json').version")
          [ "v$version" = "$TAG" ] || {
            echo "L'étiquette $TAG ne correspond pas à la version $version de package.json." >&2
            exit 1
          }
      - name: L'intégration continue est au vert sur ce commit
        run: |
          set -eu
          passed=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq 'length')
          [ "$passed" -ge 1 ] || {
            echo "Aucune intégration continue réussie sur ce commit : attendez la fin de celle de la branche principale." >&2
            exit 1
          }

  construction:
    name: Construction du site et des fichiers de la version
    needs: controle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Installer les dépendances
        run: npm ci
      - name: Construire le site
        run: npm run build
      - name: Archive, SBOM et sommes de contrôle
        run: sh scripts/release-files.sh "${GITHUB_REF_NAME#v}" release
      - name: Conserver les fichiers de la version
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fichiers-de-la-version
          path: release/
          if-no-files-found: error
      - name: Préparer le site pour GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  publication:
    name: Publication sur GitHub Pages
    needs: construction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Déployer
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  version:
    name: Version GitHub
    needs: [construction, publication]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Récupérer les fichiers de la version
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fichiers-de-la-version
          path: release
      - name: Créer la version
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "Serpent Cosmique ${GITHUB_REF_NAME#v}" --generate-notes
