name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verification:
    name: Qualité, tests et construction
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Installer les dépendances
        run: npm ci
      - name: Formatage et analyse statique
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Tests unitaires avec couverture
        run: npm test
      - name: Construction
        run: npm run build
      - name: Essai des fichiers de version (archive, SBOM, sommes de contrôle)
        run: sh scripts/release-files.sh 0.0.0 "$RUNNER_TEMP/version"
      - name: Installer les navigateurs de test
        run: npx playwright install --with-deps chromium webkit
      - name: Tests d'acceptation
        run: npm run test:e2e
      - name: Conserver les traces des tests en échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traces-playwright
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Audit des dépendances
        run: npm audit

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer Semgrep (version fixe)
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install semgrep==1.183.0
      - name: Règles locales sur src
        env:
          SEMGREP_SEND_METRICS: 'off'
        run: '"$RUNNER_TEMP/semgrep/bin/semgrep" scan --config .semgrep.yml --metrics off --disable-version-check --error src'
      - name: Récupérer les règles du registre (version figée par son commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: semgrep/semgrep-rules
          ref: 16b9e6d45f10649f6a531ec4838ed9924372c3bc
          path: .semgrep-rules
          persist-credentials: false
      - name: Règles du registre sur src
        run: '"$RUNNER_TEMP/semgrep/bin/semgrep" scan --config .semgrep-rules/javascript --config .semgrep-rules/typescript --metrics off --disable-version-check --error src'

  gitleaks:
    name: Recherche de secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Installer gitleaks (somme SHA-256 vérifiée)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/gitleaks.tar.gz" --directory "$RUNNER_TEMP" gitleaks
      - name: Analyse de tout l'historique
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose .'

  osv-scanner:
    name: osv-scanner
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --lockfile=package-lock.json
      upload-sarif: false
